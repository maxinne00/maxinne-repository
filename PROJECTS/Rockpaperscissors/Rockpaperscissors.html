<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Rockpaperscissors.css">
</head>

<body>
    <header>
        <h1>Rock Paper Scissors</h1>
    </header>
   <p>Choose your move:</p>
    <div id="choices" class="choices">
        <button onclick="startGame('Rock')">👊</button>
        <button onclick="startGame('Paper')">✋</button>
        <button onclick="startGame('Scissors')">✌️</button>
    </div>
    <br>
    

    <div id="playerDisplay"> PLAYER:</div>
    <div id="computerDisplay"> COMPUTER:</div>
    <div id="resultDisplay"> RESULT:</div>

    <div id="scoreDisplay">
        <p>Player Score: <span id="playerScore">0</span></p>
        <p>Computer Score: <span id="computerScore">0</span></p>
    </div>
</body>
<script src="Rockpaperscissors.js"></script>
</html>
