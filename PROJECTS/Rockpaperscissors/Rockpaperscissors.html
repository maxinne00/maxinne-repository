<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Rockpaperscissors.css">
</head>

<body>
        <h1>Rock Paper Scissors</h1>

    <div id="choices">
        <button onclick="startGame('rock')">👊</button>
        <button onclick="startGame('paper')">✋</button>
        <button onclick="startGame('scissors')">✌️</button>
    </div>
    <br>
    
    <div id="playerDisplay"> PLAYER:</div>
    <div id="computerDisplay"> COMPUTER:</div>
    <div id="resultDisplay"> RESULT:</div>

    <div id="scoreDisplay">
        <p>Player Score: <div id="playerScore">0</div></p>
        <p>Computer Score: <div id="computerScore">0</div></p>
    </div>
</body>
<script src="Rockpaperscissors.js"></script>
</html>
